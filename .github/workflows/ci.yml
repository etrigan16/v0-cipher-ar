name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: dummy-ci-key-do-not-use

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: npx tsc --noEmit

      - run: pnpm test -- --coverage

      - run: cd backend && pytest --cov

      - run: pnpm build
